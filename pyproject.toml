[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-filing-legal-decoder"
version = "0.2.0"
description = "AI agent skill and CLI for decoding legal-heavy SEC filing sections into finance-readable risk notes, triage decisions, and escalation questions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "SEC Filing Legal Decoder maintainers" }
]
keywords = [
  "sec",
  "sec-filings",
  "10-k",
  "20-f",
  "40-f",
  "filings",
  "annual-reports",
  "legal",
  "finance",
  "risk-triage",
  "legal-to-finance",
  "ai-agent"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sec-filing-legal-decoder = "sec_filing_legal_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
